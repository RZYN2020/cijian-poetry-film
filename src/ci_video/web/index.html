<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="editor-token" content="__TOKEN__"><title>词间 · 诗词剪辑室</title><link rel="stylesheet" href="/style.css"><script src="/editor.js" defer></script></head>
<body>
<header><a class="brand" href="/">词间<span>诗词剪辑室</span></a><div class="header-right"><span id="save-state">载入中</span><button id="reload">重新载入</button><button id="save">保存修改</button><button id="render" class="primary">导出视频 ↗</button></div></header>
<main>
<aside class="scenes"><div class="section-label">分镜 <span id="scene-count"></span></div><h1 id="title">浣溪沙</h1><p id="author" class="muted"></p><nav id="scene-list" aria-label="选择镜头"></nav><div class="aside-foot">让词句自己说话。<br>让画面留一点空白。</div></aside>
<section class="stage"><div class="stage-head"><span id="shot-label">镜头 01</span><span class="muted">画面草稿 · 成片以导出为准</span></div><div id="frame"><img id="picture" alt="当前镜头画面"><video id="picture-video" muted loop playsinline hidden></video><div id="poem-line"></div></div><div id="scene-summary"></div><div class="listen"><span>原词朗诵</span><audio id="voice" controls preload="metadata"></audio></div><div class="timeline" id="timeline" aria-label="分镜时间线"></div><p class="muted stage-note">可单独试听每句。停顿、字幕与背景音乐的完整效果请查看导出视频。</p></section>
<aside class="inspector"><div class="section-label">镜头调整</div><section><h2 id="scene-title">—</h2><div class="pair"><label>镜头时长 / 秒<input id="duration" type="number" min="0.5" max="30" step="0.25"></label><label>朗诵入点 / 秒<input id="offset" type="number" min="0" step="0.1"></label></div><p class="hint">修改入点时，字幕会随声音一起移动。</p><label>画面素材<select id="asset"></select></label><button id="import-image" class="wide">＋ 导入替换图片</button><label>画面描述<textarea id="visual" rows="3"></textarea></label><p class="hint">描述保存到分镜，供后续生图使用；保存不会自动生图。</p></section>
<section><div class="section-label">声音</div><label>重新生成朗诵<select id="provider"><option value="edge">晓晓女声 · Edge 在线语音</option><option value="external">已配置的语音 API · 可能计费</option></select></label><button id="tts" class="wide">重新生成六句朗诵</button><p id="voice-details" class="hint"></p></section>
<section><div class="section-label">背景音乐</div><label>当前曲目<select id="music"></select></label><audio id="music-audio" controls preload="metadata"></audio><label>音乐音量 <output id="volume-value"></output><input id="volume" type="range" min="0" max="0.6" step="0.01"></label><div class="pair"><label>起始位置 / 秒<input id="music-start" type="number" min="0" step="1"></label><label>淡入淡出 / 秒<input id="fade" type="number" min="0.1" step="0.5"></label></div><label>朗诵时保留音量 <output id="duck-value"></output><input id="duck" type="range" min="0" max="1" step="0.05"></label><button id="import-music" class="wide">＋ 导入本地音乐</button><label>音乐目录<select id="catalog"></select></label><button id="download-music" class="wide">下载并使用所选音乐</button><p class="hint" id="music-credit"></p></section></aside>
</main>
<section class="export-panel"><div><div class="section-label">成片</div><h2>把这一刻留住</h2><p id="output-state" class="muted"></p><a id="download" class="button" href="/media/output.mp4" download="词间.mp4" hidden>下载 MP4</a><p class="hint">发布时请附上项目 credits.md 中的音乐署名。</p></div><video id="output" controls preload="metadata" playsinline hidden></video></section>
<section id="job-panel" hidden><strong id="job-title"></strong><pre id="job-log" aria-live="polite"></pre></section><div id="notice" role="status" aria-live="polite"></div>
<dialog id="upload-dialog"><form id="upload-form"><h2 id="upload-title">导入素材</h2><label>文件<input id="upload-file" type="file" required></label><label>来源（链接或说明）<input id="upload-source" required placeholder="例如：本人拍摄 / 音乐下载页面"></label><label>作者或提供方<input id="upload-creator" required></label><label>许可或使用权说明<input id="upload-license" required placeholder="例如：本人原创 / CC BY 4.0"></label><label>完整署名（音乐适用）<textarea id="upload-credit" rows="2"></textarea></label><p class="hint">支持 PNG、JPG、WebP 或 MP3、WAV、M4A，最大 30 MB。</p><div class="dialog-actions"><button type="button" id="cancel-upload">取消</button><button type="submit" class="primary">导入并使用</button></div></form></dialog>
</body></html>
